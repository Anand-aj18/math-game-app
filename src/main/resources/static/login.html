<!DOCTYPE html>
<html>
<head>
    <title>Math Game Login</title>
    <link rel="stylesheet" href="/css/game-theme.css">
</head>

<body>

<div class="card">

    <h2>Math Game Login</h2>

    <!-- Google login -->
    <a href="/oauth2/authorization/google">
        <button>Login with Google</button>
    </a>

    <hr>

    <!-- OTP login UI -->
    <h3>Mobile OTP Login</h3>

    <input id="phone" placeholder="+91XXXXXXXXXX">

    <div id="recaptcha"></div>

    <button onclick="sendOTP()">Send OTP</button>

    <br><br>

    <input id="otp" placeholder="Enter OTP">

    <button onclick="verifyOTP()">Verify OTP</button>

</div>

<!-- Firebase scripts -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
        getAuth,
        RecaptchaVerifier,
        signInWithPhoneNumber
    }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


    // 🔥 STEP 4 — paste your Firebase config here
    const firebaseConfig = {
        apiKey: "AIzaSyCgTUrb9FiJL8D6VMoCe1jSaSDvw8AC9uY",
        authDomain: "maths-app-4ed32.firebaseapp.com",
        projectId: "maths-app-4ed32",
        storageBucket: "maths-app-4ed32.firebasestorage.app",
        messagingSenderId: "982961337902",
        appId: "1:982961337902:web:0d8aa61fb226c7f7ab91bf",
        measurementId: "G-RBJC7JL2VB"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // invisible captcha
    window.recaptcha = new RecaptchaVerifier(auth,
        "recaptcha",
        { size: "normal" }
    );


    // send OTP
    window.sendOTP = async () => {

        try {

            let raw =
                document.getElementById("phone").value.trim();

            // remove spaces
            raw = raw.replace(/\s+/g, "");

            // auto add +91 if user enters 10 digits
            if(/^\d{10}$/.test(raw)){
                raw = "+91" + raw;
            }

            // final validation
            if(!/^\+\d{10,15}$/.test(raw)){
                alert("Enter valid phone number like +919876543210");
                return;
            }

            window.confirmation =
                await signInWithPhoneNumber(
                    auth,
                    raw,
                    window.recaptcha
                );

            alert("OTP sent!");

        } catch(e){

            alert("Error: " + e.message);

        }
    };

    window.verifyOTP = async () => {

        try {

            const code =
                document.getElementById("otp").value;

            if(!window.confirmation){
                alert("Send OTP first!");
                return;
            }

            await window.confirmation.confirm(code);

            document.body.innerHTML =
                "<h2>Login success… redirecting</h2>";

            setTimeout(() => {
                window.location.href = "player.html";
            }, 800);

        } catch(e){

            alert("Invalid OTP!");

        }

    };

</script>

</body>
</html>

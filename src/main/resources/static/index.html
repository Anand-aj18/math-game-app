<!DOCTYPE html>
<html>

<head>
    <title>Top Rankers</title>

    <link rel="stylesheet" href="/css/game-theme.css">

</head>

<body>

<div class="card">

    <h2>Top Rankers</h2>

    <table border="1">
        <thead>
        <tr>
            <th>Class</th>
            <th>Rank 1 Player</th>
            <th>Score</th>
        </tr>
        </thead>

        <tbody id="rankTable"></tbody>
    </table>

    <br>

    <button onclick="location.href='login.html'">
        Go To Login
    </button>

</div>

<script>

    fetch("/leaderboard/top-rankers")
        .then(res => res.json())
        .then(data => {

            let table =
                document.getElementById("rankTable");

            data.forEach(r => {

                table.innerHTML += `
<tr>
<td>${r.classNo}</td>
<td>${r.player}</td>
<td>${r.score}</td>
</tr>`;
            });

        });

</script>

</body>
</html>

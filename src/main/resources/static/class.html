<head>
    <link rel="stylesheet" href="/css/game-theme.css">
</head>

<body>

<h2 style="margin-top:20px;">Select Class</h2>

<div class="center-box">

    <div id="classes"></div>

</div>

<script>
    for(let i=1;i<=10;i++){
        classes.innerHTML +=
            `<button onclick="startGame(${i})">
                Class ${i}
            </button><br><br>`;
    }

    function startGame(cls){
        localStorage.setItem("class", cls);
        location = "game.html";
    }
</script>

</body>

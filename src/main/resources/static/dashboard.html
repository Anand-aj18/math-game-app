<head>
    <link rel="stylesheet" href="/css/game-theme.css">
</head>

<div class="card">

    <h2>Dashboard</h2>

    <br>

    <button onclick="loadBoard()">Show Leaderboard</button>

    <div id="board"></div>

    <br>

    <button onclick="exitGame()">Exit</button>

</div>

<script>

    const playerInfo = document.getElementById("playerInfo");
    const board = document.getElementById("board");

    playerInfo.innerHTML = `
<h3>Player Info</h3>
Name: ${localStorage.getItem("name")} <br>
Age: ${localStorage.getItem("age")} <br>
Gender: ${localStorage.getItem("gender")}
`;

    async function loadBoard(){

        let cls = localStorage.getItem("class");

        let r = await fetch(`/game/leaderboard?cls=${cls}`);
        let data = await r.json();

        board.innerHTML = `
<h3>Leaderboard</h3>
<table border="1" width="100%">
<tr>
<th>Rank</th>
<th>Name</th>
<th>Age</th>
<th>Gender</th>
<th>Score</th>
<th>Review</th>
</tr>
</table>
`;

        let table = board.querySelector("table");

        data.forEach((s,i)=>{

            let userId = s.userId || s.id || 0;

            table.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${s.username || s.user || "Player"}</td>
<td>${s.age || "-"}</td>
<td>${s.gender || "-"}</td>
<td>${s.points}</td>
<td>
<button onclick="reviewUser(${userId})">
Review
</button>
</td>
</tr>`;
        });
    }

    function reviewUser(userId){

// store selected user
        localStorage.setItem("reviewUser", userId);

// go to review page
        location = "review.html";
    }

    function exitGame(){

        localStorage.clear();
        location="login.html";
    }

</script>
